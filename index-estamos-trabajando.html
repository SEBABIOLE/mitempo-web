<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiTempo.app - Estamos trabajando</title>
<meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff8a00, #ff512f);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 2rem;
      border-radius: 1rem;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 2em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
    }
    .logo {
      width: 100px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://mitempo.app/logo.png" alt="MiTempo Logo" class="logo" />
    <h1>🚧 MiTempo está en remodelación</h1>
    <p>Estamos trabajando para traerte una experiencia aún más inteligente, simple y potente.</p>
    <p>Volvé pronto 🙌</p>
  </div>
</body>
</html>
